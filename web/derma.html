<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Derma receptář</title>
<style>
:root {
  --bg:        #0b0d17;
  --surface:   #131626;
  --card:      #181c2e;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.13);
  --text:      #dde3ff;
  --muted:     rgba(221,227,255,0.45);
  --accent:    #4f7ef8;
  --accent2:   #3563e9;
  --as:        rgba(79,126,248,0.15);
  --green:     #34d399;
  --gs:        rgba(52,211,153,0.13);
  --red:       #f87171;
  --rs:        rgba(248,113,113,0.13);
  --yellow:    #fbbf24;
  --ys:        rgba(251,191,36,0.13);
  --r:         12px;
  --ease:      cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; padding:0 0 80px;
}

/* ─ header ─ */
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; border-bottom:1px solid var(--border);
  background:var(--surface); position:sticky; top:0; z-index:100;
}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:.9rem;
}
.logo-text{font-weight:700;font-size:1rem;color:var(--text)}
.logo-sub{font-size:.75rem;color:var(--muted);margin-left:2px}
.header-right{display:flex;align-items:center;gap:12px}
.progress-wrap{
  width:120px;height:6px;background:var(--border);
  border-radius:999px;overflow:hidden;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--green));
  border-radius:999px;transition:width .5s var(--ease);
}
.prog-label{font-size:.75rem;color:var(--muted);white-space:nowrap}

/* ─ layout ─ */
.layout{
  display:grid;
  grid-template-columns:260px 1fr;
  max-width:1100px;margin:0 auto;
  gap:0; min-height:calc(100vh - 58px);
}

/* ─ sidebar ─ */
.sidebar{
  border-right:1px solid var(--border);
  padding:20px 16px;
  position:sticky; top:57px;
  height:calc(100vh - 57px);
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.sidebar-title{
  font-size:.7rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding:0 4px;
}
.recipe-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px; border-radius:var(--r);
  cursor:pointer; transition:background .15s,border-color .15s;
  border:1px solid transparent; margin-bottom:4px;
  user-select:none;
}
.recipe-item:hover{background:rgba(255,255,255,.05)}
.recipe-item.active{
  background:var(--as); border-color:rgba(79,126,248,.4);
}
.recipe-item .ri-check{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem; color:transparent; transition:.2s;
}
.recipe-item.mastered .ri-check{
  background:var(--green);border-color:var(--green);color:#000;
}
.recipe-item .ri-name{font-size:.82rem;font-weight:500;line-height:1.3}
.recipe-item .ri-tag{font-size:.7rem;color:var(--muted);margin-top:1px}

/* ─ main ─ */
.main{padding:28px 32px}

/* welcome state */
.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:400px; text-align:center; gap:12px;
}
.welcome-icon{font-size:3rem;margin-bottom:8px}
.welcome h2{font-size:1.4rem;font-weight:700}
.welcome p{color:var(--muted);font-size:.9rem;max-width:340px;line-height:1.6}

/* target card */
.target-card{
  background:var(--card); border:1px solid var(--border2);
  border-radius:16px; padding:24px; margin-bottom:20px;
}
.tc-label{
  font-size:.7rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px;
}
.tc-name{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.tc-pills{display:flex;flex-wrap:wrap;gap:8px}
.tc-pill{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;font-size:.78rem;
  background:var(--surface); border:1px solid var(--border2);
}
.tc-pill .pill-icon{font-size:.85rem}
.tc-pill strong{color:var(--text)}
.tc-pill span{color:var(--muted)}

/* section labels */
.sec-label{
  font-size:.7rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{
  content:""; flex:1; height:1px; background:var(--border);
}

/* ingredient picker */
.ing-picker{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;
}
.ing-chip{
  padding:6px 14px;border-radius:999px;font-size:.8rem;font-weight:500;
  border:1px solid var(--border2);background:var(--surface);
  cursor:pointer; transition:all .15s; user-select:none;
  display:flex;align-items:center;gap:5px;
}
.ing-chip:hover{background:rgba(255,255,255,.07);border-color:var(--border2)}
.ing-chip.selected{
  background:var(--as);border-color:rgba(79,126,248,.5);color:var(--text);
}
.ing-chip .chip-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--border2); transition:.15s;flex-shrink:0;
}
.ing-chip.selected .chip-dot{background:var(--accent)}

/* mixing table */
.mix-table{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;margin-bottom:20px;
}
.mix-empty{
  padding:24px;text-align:center;color:var(--muted);font-size:.85rem;
}
.mix-row{
  display:grid;
  grid-template-columns:1fr 110px 160px 36px;
  align-items:center;gap:12px;
  padding:10px 16px; border-bottom:1px solid var(--border);
  transition:background .15s;
}
.mix-row:last-child{border-bottom:none}
.mix-row:hover{background:rgba(255,255,255,.02)}
.mix-name{font-size:.85rem;font-weight:500}
.mix-input{
  width:100%;padding:6px 10px;text-align:right;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:8px;color:var(--text);font-size:.85rem;outline:none;
  transition:border-color .15s;
}
.mix-input:focus{border-color:var(--accent)}
.mix-input::placeholder{color:var(--muted)}
.mix-select{
  width:100%;padding:6px 8px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:8px;color:var(--text);font-size:.78rem;outline:none;
  cursor:pointer; transition:border-color .15s;
}
.mix-select:focus{border-color:var(--accent)}
.mix-remove{
  background:none;border:none;color:var(--muted);cursor:pointer;
  padding:4px;border-radius:6px;font-size:1rem;
  transition:color .15s,background .15s;display:flex;align-items:center;
}
.mix-remove:hover{color:var(--red);background:var(--rs)}

/* actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.btn{
  padding:10px 20px;border-radius:10px;font-size:.85rem;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;display:flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 2px 12px rgba(79,126,248,.3);
}
.btn-primary:hover{box-shadow:0 4px 20px rgba(79,126,248,.45);filter:brightness(1.05)}
.btn-ghost{
  background:var(--surface);color:var(--text);
  border:1px solid var(--border2);
}
.btn-ghost:hover{background:rgba(255,255,255,.07)}
.btn-next{margin-left:auto}

/* result */
.result{
  border-radius:var(--r);padding:16px 20px;margin-bottom:20px;
  display:none;animation:slideIn .2s var(--ease);
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result.show{display:block}
.result.correct{background:var(--gs);border:1px solid rgba(52,211,153,.3)}
.result.wrong{background:var(--rs);border:1px solid rgba(248,113,113,.25)}
.result.hint{background:var(--ys);border:1px solid rgba(251,191,36,.25)}
.result-head{font-weight:700;font-size:.95rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.result.correct .result-head{color:var(--green)}
.result.wrong   .result-head{color:var(--red)}
.result.hint    .result-head{color:var(--yellow)}
.result-rows{display:flex;flex-direction:column;gap:4px}
.r-row{font-size:.82rem;padding:4px 0;display:flex;align-items:baseline;gap:6px;line-height:1.4}
.r-row.ok  {color:var(--green)}
.r-row.err {color:var(--red)}
.r-row.miss{color:var(--yellow)}
.r-row .r-icon{flex-shrink:0;font-size:.75rem}
.r-row .r-note{color:var(--muted);font-size:.78rem}

/* responsive */
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  .main{padding:20px 16px}
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <div class="logo-icon">🧪</div>
    <div>
      <div class="logo-text">Derma receptář</div>
      <div class="logo-sub">procvičování na zkoušku</div>
    </div>
  </a>
  <div class="header-right">
    <span class="prog-label" id="prog-label">0 / 12</span>
    <div class="progress-wrap">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-title">Recepty</div>
    <div id="recipe-list"></div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">💊</div>
      <h2>Vyber recept vlevo</h2>
      <p>Klikni na název přípravku a namíchej správné ingredience ve správném množství.</p>
    </div>
    <div id="game" style="display:none">
      <div class="target-card" id="target-card"></div>
      <div class="sec-label">Dostupné suroviny</div>
      <div class="ing-picker" id="ing-picker"></div>
      <div class="sec-label">Tvůj recept</div>
      <div class="mix-table" id="mix-table"></div>
      <div class="actions">
        <button class="btn btn-primary" onclick="checkRecipe()">✓ Zkontrolovat</button>
        <button class="btn btn-ghost" onclick="showHint()">💡 Napovědět</button>
        <button class="btn btn-ghost" onclick="resetMix()">✕ Vyčistit</button>
        <button class="btn btn-ghost btn-next" onclick="nextRecipe()">Další →</button>
      </div>
      <div class="result" id="result"></div>
    </div>
  </main>

</div>

<script>
const RECIPES = [
  {
    id:"jarischuv", name:"Jarischův roztok",
    use:"Protizánětlivý a mírně protimikrobiální",
    indication:"Obklady na obličeji – mokvající ekzém",
    dosage:"k obkladům",
    form:"roztok",
    ing:[
      {name:"Acidi borici",    amount:20,   type:"pevne"},
      {name:"Glycerini",       amount:40,   type:"pevne"},
      {name:"Aqua destilata",  amount:1000, type:"ad"},
    ]
  },
  {
    id:"salicylresorcinovy", name:"Salicylresorcinový líh",
    use:"Protizánětlivý",
    indication:"Seboroická dermatitida – ochlupené části těla",
    dosage:"2× denně natřít",
    form:"líh",
    ing:[
      {name:"Acidi salicylici",  amount:4,   type:"aa"},
      {name:"Resorcini",         amount:4,   type:"aa"},
      {name:"Glycerini",         amount:10,  type:"pevne"},
      {name:"Spiritus vini dil.",amount:200, type:"ad"},
    ]
  },
  {
    id:"tekutypudr", name:"Tekutý pudr s mentolem",
    use:"Protisvědivý",
    indication:"Kopřivka",
    dosage:"2× denně natřít",
    form:"pudr",
    ing:[
      {name:"Mentoli",         amount:2,   type:"pevne"},
      {name:"Zinci oxydati",   amount:30,  type:"aa"},
      {name:"Talcum venetum",  amount:30,  type:"aa"},
      {name:"Glyceroli",       amount:30,  type:"aa"},
      {name:"Aqua destilata",  amount:200, type:"ad"},
    ]
  },
  {
    id:"bortaninovy", name:"Bortaninový zásyp",
    use:"Vysušuje kůži",
    indication:"Intertrigo",
    dosage:"2× denně zasypat",
    form:"zásyp",
    ing:[
      {name:"Acidi borici",   amount:1.5, type:"aa"},
      {name:"Acidi tannici",  amount:1.5, type:"aa"},
      {name:"Zinci oxydati",  amount:50,  type:"aa_ad"},
      {name:"Talcum venetum", amount:50,  type:"aa_ad"},
    ]
  },
  {
    id:"pletovemléko", name:"Pleťové mléko",
    use:"Promazání a hydratace",
    indication:"Přesušená pokožka",
    dosage:"2× denně natřít",
    form:"mléko",
    ing:[
      {name:"Ambidermani",    amount:30,  type:"pevne"},
      {name:"Aqua destilata", amount:100, type:"ad"},
    ]
  },
  {
    id:"saloxylovyolej", name:"Saloxylový olej",
    use:"Protibakteriální, protizánětlivý",
    indication:"Impetiginizované dermatózy",
    dosage:"2× denně natřít",
    form:"olej",
    ing:[
      {name:"Saloxyl ung.",    amount:30,  type:"pevne"},
      {name:"Oleum helianthi", amount:100, type:"ad"},
    ]
  },
  {
    id:"kortikoidnimast", name:"Kortikoidní mast",
    use:"Protizánětlivá, imunosupresivní",
    indication:"Záněty kůže vyžadující kortikoid",
    dosage:"2× denně natřít",
    form:"mast",
    ing:[
      {name:"Dexamethazoni", amount:0.02, type:"pevne"},
      {name:"Cutilani",      amount:100,  type:"ad"},
    ]
  },
  {
    id:"salicylavazelina", name:"Salicylová vazelina 5%",
    use:"Keratolytická",
    indication:"Psoriáza, chronický ekzém",
    dosage:"2× denně natřít",
    form:"mast",
    ing:[
      {name:"Acidi salicylici", amount:5,   type:"pevne"},
      {name:"Vaselinum",        amount:100, type:"ad"},
    ]
  },
  {
    id:"pastasalidet", name:"Pasta se salicylem a dehtem 5%",
    use:"Keratolytická, antipruriginózní",
    indication:"Psoriáza – pasta s kamenouhelným dehtem",
    dosage:"1× denně natřít",
    form:"pasta",
    ing:[
      {name:"Acidi salicylici",   amount:5,   type:"aa"},
      {name:"Picis lithantracis", amount:5,   type:"aa"},
      {name:"Zinci oxydati",      amount:10,  type:"aa"},
      {name:"Talcum venetum",     amount:10,  type:"aa"},
      {name:"Vaselinum",          amount:100, type:"ad"},
    ]
  },
  {
    id:"lassarova", name:"Lassarova pasta",
    use:"Krycí, ochranná",
    indication:"Bércový vřed – chrání okolní kůži",
    dosage:"1× denně natřít",
    form:"pasta",
    ing:[
      {name:"Acidi salicylici",  amount:2,   type:"pevne"},
      {name:"Oleum helianthi",   amount:10,  type:"pevne"},
      {name:"Pasta zinci oxid.", amount:100, type:"ad"},
    ]
  },
  {
    id:"kolodium", name:"Kolodium",
    use:"Keratolytické",
    indication:"Bradavice, mozoly, hyperkeratózy",
    dosage:"Nanést na bradavice",
    form:"roztok",
    ing:[
      {name:"Acidi salicylici",    amount:6,  type:"aa"},
      {name:"Acidi lactici",       amount:6,  type:"aa"},
      {name:"Collodium elasticum", amount:30, type:"ad"},
    ]
  },
  {
    id:"sampon", name:"Šampon",
    use:"Keratolytický, protiseboroický",
    indication:"Psoriáza kštice, seboroická dermatitida",
    dosage:"Jako šampon",
    form:"šampon",
    ing:[
      {name:"Acidi salicylici",      amount:6,   type:"aa"},
      {name:"Resorcini",             amount:6,   type:"aa"},
      {name:"Spiritus saponis kal.", amount:300, type:"ad"},
    ]
  },
];

const TYPE_LABELS = {
  pevne:  "pevné",
  ad:     "ad (doplnit do)",
  aa:     "aa (stejné díly)",
  aa_ad:  "aa ad",
};

const ALL_ING = [...new Set(RECIPES.flatMap(r => r.ing.map(i => i.name)))].sort();

// state
let current  = null;
let mix      = {};   // { name: { amount, type } }
let mastered = new Set(JSON.parse(localStorage.getItem("dm_mastered")||"[]"));
let stats    = JSON.parse(localStorage.getItem("dm_stats")||'{"ok":0,"err":0}');

// ── boot ────────────────────────────────────────────────────────────────────
window.onload = () => { renderSidebar(); renderIngPicker(); updateProgress(); };

// ── sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar() {
  document.getElementById("recipe-list").innerHTML = RECIPES.map(r => `
    <div class="recipe-item ${mastered.has(r.id)?"mastered":""} ${current?.id===r.id?"active":""}"
         onclick="loadRecipe('${r.id}')">
      <div class="ri-check">${mastered.has(r.id)?"✓":""}</div>
      <div>
        <div class="ri-name">${r.name}</div>
        <div class="ri-tag">${r.form} · ${r.indication.split("–")[0].trim()}</div>
      </div>
    </div>`).join("");
}

// ── load recipe ──────────────────────────────────────────────────────────────
function loadRecipe(id) {
  current = RECIPES.find(r => r.id === id);
  mix = {};
  hideResult();
  document.getElementById("welcome").style.display = "none";
  document.getElementById("game").style.display = "block";

  // target card
  document.getElementById("target-card").innerHTML = `
    <div class="tc-label">Namíchej tento přípravek</div>
    <div class="tc-name">${current.name}</div>
    <div class="tc-pills">
      <div class="tc-pill"><span class="pill-icon">🎯</span><strong>${current.use}</strong></div>
      <div class="tc-pill"><span class="pill-icon">📋</span><span>Indikace:</span><strong>${current.indication}</strong></div>
      <div class="tc-pill"><span class="pill-icon">💊</span><span>Dávkování:</span><strong>${current.dosage}</strong></div>
      <div class="tc-pill"><span class="pill-icon">🧴</span><span>Forma:</span><strong>${current.form}</strong></div>
    </div>`;

  renderIngPicker();
  renderMixTable();
  renderSidebar();
  window.scrollTo({top:0,behavior:"smooth"});
}

// ── ingredient picker ────────────────────────────────────────────────────────
function renderIngPicker() {
  document.getElementById("ing-picker").innerHTML = ALL_ING.map(name => `
    <div class="ing-chip ${mix[name]?"selected":""}"
         onclick="toggleIng('${esc(name)}')">
      <span class="chip-dot"></span>${name}
    </div>`).join("");
}

function toggleIng(name) {
  if (mix[name]) { delete mix[name]; }
  else { mix[name] = { amount:"", type:"pevne" }; }
  renderIngPicker();
  renderMixTable();
}

// ── mix table ────────────────────────────────────────────────────────────────
function renderMixTable() {
  const keys = Object.keys(mix);
  const el = document.getElementById("mix-table");
  if (!keys.length) {
    el.innerHTML = `<div class="mix-empty">Klikni na suroviny výše ↑ a přidej je do receptu.</div>`;
    return;
  }
  el.innerHTML = keys.map(name => `
    <div class="mix-row">
      <div class="mix-name">${name}</div>
      <input class="mix-input" type="number" min="0" step="0.01"
             value="${mix[name].amount}" placeholder="množství (g)"
             oninput="setAmt('${esc(name)}',this.value)"/>
      <select class="mix-select" onchange="setType('${esc(name)}',this.value)">
        ${Object.entries(TYPE_LABELS).map(([k,v])=>
          `<option value="${k}" ${mix[name].type===k?"selected":""}>${v}</option>`
        ).join("")}
      </select>
      <button class="mix-remove" onclick="removeIng('${esc(name)}')">✕</button>
    </div>`).join("");
}

function setAmt(name,v)  { if(mix[name]) mix[name].amount=v; }
function setType(name,v) { if(mix[name]) mix[name].type=v; }
function removeIng(name) { delete mix[name]; renderIngPicker(); renderMixTable(); }
function resetMix()      { mix={}; hideResult(); renderIngPicker(); renderMixTable(); }

// ── check ────────────────────────────────────────────────────────────────────
function checkRecipe() {
  if (!current) return;
  const correct = current.ing;
  let rows = []; let allOk = true;

  correct.forEach(ci => {
    const u = mix[ci.name];
    if (!u) {
      rows.push({cls:"miss", icon:"✗", text:`Chybí: <strong>${ci.name}</strong>`, note:`má být ${ci.amount} g · ${TYPE_LABELS[ci.type]}`});
      allOk=false; return;
    }
    const amtOk  = Math.abs(parseFloat(u.amount)-ci.amount) < 0.001;
    const typeOk = u.type===ci.type;
    if (amtOk&&typeOk) {
      rows.push({cls:"ok", icon:"✓", text:`${ci.name} — ${ci.amount} g`, note:TYPE_LABELS[ci.type]});
    } else {
      allOk=false;
      let note="";
      if(!amtOk)  note+=`množství: máš <em>${u.amount||"—"}</em>, má být <strong>${ci.amount}</strong> g. `;
      if(!typeOk) note+=`typ: máš <em>${TYPE_LABELS[u.type]}</em>, má být <strong>${TYPE_LABELS[ci.type]}</strong>.`;
      rows.push({cls:"err",icon:"✗",text:ci.name,note});
    }
  });

  Object.keys(mix).forEach(name => {
    if (!correct.find(ci=>ci.name===name))
      rows.push({cls:"err",icon:"✗",text:`${name}`,note:"tato surovina tam nepatří"});
      allOk=false;
  });

  if (allOk) {
    mastered.add(current.id);
    localStorage.setItem("dm_mastered", JSON.stringify([...mastered]));
    stats.ok++; localStorage.setItem("dm_stats",JSON.stringify(stats));
    showResult("correct","🎉 Správně! Recept je perfektní.",rows);
  } else {
    stats.err++; localStorage.setItem("dm_stats",JSON.stringify(stats));
    showResult("wrong","✗ Recept má chyby — oprav je a zkus znovu.",rows);
  }
  updateProgress(); renderSidebar();
}

// ── hint ─────────────────────────────────────────────────────────────────────
function showHint() {
  if (!current) return;
  const rows = current.ing.map(ci=>({
    cls:"miss", icon:"→",
    text:`${ci.name} — <strong>${ci.amount} g</strong>`,
    note:TYPE_LABELS[ci.type]
  }));
  showResult("hint","💡 Správný recept:",rows);
}

// ── result ───────────────────────────────────────────────────────────────────
function showResult(cls, head, rows) {
  const el = document.getElementById("result");
  el.className = `result show ${cls}`;
  el.innerHTML = `
    <div class="result-head">${head}</div>
    <div class="result-rows">
      ${rows.map(r=>`
        <div class="r-row ${r.cls}">
          <span class="r-icon">${r.icon}</span>
          <span>${r.text}</span>
          ${r.note?`<span class="r-note">– ${r.note}</span>`:""}
        </div>`).join("")}
    </div>`;
  el.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function hideResult() { const el=document.getElementById("result"); if(el){el.className="result";el.innerHTML="";} }

// ── next ──────────────────────────────────────────────────────────────────────
function nextRecipe() {
  const pool = RECIPES.filter(r=>!mastered.has(r.id));
  if (!pool.length) { alert("🎓 Skvělé! Zvládl/a jsi všechny recepty!"); return; }
  loadRecipe(pool[Math.floor(Math.random()*pool.length)].id);
}

// ── progress ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const n = mastered.size, t = RECIPES.length;
  document.getElementById("prog-label").textContent = `${n} / ${t}`;
  document.getElementById("prog-fill").style.width  = (n/t*100)+"%";
}

function esc(s) { return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
</script>
</body>
