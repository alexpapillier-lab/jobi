name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  kontrola:
    name: Typecheck, lint a testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint má --max-warnings=9999, takže tady hlídáme jen errors.
      - name: Lint
        run: npm run lint

      - name: Testy
        run: npm run test:run

      # Webová verze má vlastní vite config a stuby místo Tauri API. Bez tohohle
      # kroku se její rozbití pozná až po nasazení na appjobi.com/servis/.
      - name: Build webové verze
        run: npm run build:web

      - name: Audit produkčních závislostí
        run: npm audit --omit=dev

  # Kontrola, že s anon klíčem není zvenčí vidět nic, co vidět nemá.
  # Dívá se na SKUTEČNOU databázi, ne na migrace – ty můžou být v pořádku
  # a produkce přesto ne, když se nenasadily.
  #
  # Vzniklo po nálezu z 2. 9. 2026, kdy capture_tokens a draft_capture_photos
  # neměly zapnuté RLS a půl roku si toho nikdo nevšiml.
  #
  # Běží jen na main a jen když jsou k dispozici secrets (na forku nejsou),
  # aby to neblokovalo běžné PR.
  rls:
    name: RLS – anonymní přístup
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Kontrola anonymního přístupu k tabulkám
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run test:integration
