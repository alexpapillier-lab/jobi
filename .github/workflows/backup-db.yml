name: Záloha databáze

# Supabase na Free plánu zálohy nedělá a i na Pro drží jen posledních pár dní
# u sebe. Tohle je nezávislá denní kopie: šifrovaná, uložená mimo Supabase
# jako artefakt téhle akce, a hned taky vyzkoušená obnovou do čistého Postgresu,
# ať se o nepoužitelné záloze nedozvíme až v den, kdy ji budeme potřebovat.
#
# Zkoušku obnovy dělá scripts/zkouska-obnovy.sh – ten samý skript, který si
# člověk pustí lokálně (docs/OBNOVA_ZE_ZALOHY.md). Co ověří CI, ověří i on.
#
# Potřebné secrets v repozitáři (Settings → Secrets → Actions):
#   SUPABASE_DB_URL     connection string i s heslem (session pooler, port 5432)
#   BACKUP_PASSPHRASE   heslo, kterým se záloha symetricky zašifruje
# Bez nich se běh rovnou ukončí s vysvětlením.

on:
  schedule:
    # 02:30 UTC = 04:30 v létě, 03:30 v zimě – v tu dobu nikdo nepracuje.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      soubory:
        description: "Zálohovat i soubory ve Storage (jinak jen v neděli)"
        type: boolean
        default: false

concurrency:
  group: zaloha-db
  cancel-in-progress: false

jobs:
  zaloha:
    name: Dump, šifrování a zkouška obnovy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # Do tohohle prázdného Postgresu se záloha hned zkusí nahrát zpátky.
      obnova:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: zkouska
          POSTGRES_DB: obnova
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Kontrola secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HESLO: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          chybi=""
          [ -z "$DB_URL" ] && chybi="$chybi SUPABASE_DB_URL"
          [ -z "$HESLO" ] && chybi="$chybi BACKUP_PASSPHRASE"
          if [ -n "$chybi" ]; then
            echo "::error::Chybí secrets:$chybi. Nastav je v Settings → Secrets and variables → Actions. Postup je v docs/ZALOHY_DATABAZE.md."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Klient postgresql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 || sudo apt-get install -y -qq postgresql-client

      - name: Dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p zaloha
          supabase db dump --db-url "$DB_URL" -f zaloha/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f zaloha/schema.sql
          supabase db dump --db-url "$DB_URL" -f zaloha/data.sql --use-copy --data-only

          # Dump bere jen schéma public a data z public/auth/storage. Věci
          # kolem něj se do zálohy nedostanou samy, a přitom bez nich servis
          # po obnově nefunguje – proto se ukládají zvlášť.

          # Soubory ve Storage v dumpu nejsou – aspoň si uložíme jejich seznam,
          # ať je po havárii vidět, co chybí.
          psql "$DB_URL" -At -F ',' -c \
            "select bucket_id, name, coalesce((metadata->>'size')::bigint, 0), created_at from storage.objects order by bucket_id, name" \
            > zaloha/storage-soubory.csv

          # Naplánované úlohy (pg_cron) – schéma cron dump vynechává, takže by
          # se po obnově nic samo nespouštělo: žádné automatizace, hlídač ani úklid.
          psql "$DB_URL" -At -c \
            "select format('select cron.schedule(%L, %L, %L);', jobname, schedule, command) from cron.job where active order by jobid" \
            > zaloha/cron-ulohy.sql

          # Historie migrací – bez ní by supabase db push na obnovené databázi
          # chtěl přehrát všech ~140 migrací znovu.
          psql "$DB_URL" -At -F ',' -c \
            "select version, name from supabase_migrations.schema_migrations order by version" \
            > zaloha/migrace.csv

          # Vault: ukládáme JEN názvy tajemství, nikdy hodnoty. Hodnoty se po
          # havárii vytvoří znovu (jsou to sdílená hesla mezi cronem a edge funkcemi).
          psql "$DB_URL" -At -c "select name from vault.secrets order by name" \
            > zaloha/vault-nazvy.txt

          cat > zaloha/CO_CHYBI.md <<'KONEC'
          # Co v téhle záloze NENÍ

          Postup obnovy: docs/OBNOVA_ZE_ZALOHY.md v repozitáři.

          * **Soubory ve Storage** (fotky z diagnostiky, obrázky produktů) –
            v `storage-soubory.csv` je jen jejich seznam. Samotné soubory se
            zálohují zvlášť (artefakt `zaloha-storage-*`, jednou týdně).
          * **Hodnoty tajemství ve Vaultu** – jsou tu jen názvy (`vault-nazvy.txt`).
          * **Tajemství edge funkcí** (RESEND_API_KEY, TWILIO_*, SUPABASE_SERVICE_ROLE_KEY…) –
            nastavují se znovu ručně, `supabase secrets set`.
          * **Nastavení Auth** – povolení poskytovatelé, SMTP, adresy pro
            přesměrování, JWT secret. Nový projekt = nový JWT secret a nové API klíče.
          * **Kód edge funkcí** – ten je v gitu (`supabase/functions`), nasazuje
            se `supabase functions deploy`.
          KONEC

          ls -lh zaloha

      - name: Zkouška obnovy do čistého Postgresu
        env:
          OBNOVA_DB_URL: postgresql://postgres:zkouska@localhost:5432/obnova
        run: bash scripts/zkouska-obnovy.sh zaloha

      - name: Porovnání s ostrou databází
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: zkouska
        run: |
          set -euo pipefail
          # Zkouška obnovy porovnává obnovenou databázi proti obsahu zálohy.
          # Tenhle krok hlídá druhou půlku otázky: jestli v záloze nechybí celá
          # tabulka. Menší rozdíly jsou normální – mezi dumpem a touhle kontrolou
          # na ostré databázi přibudou další zakázky – proto se hlásí jen
          # tabulka, která je v ostré databázi plná a v obnovené prázdná.
          psql "$DB_URL" -At -F '|' -c "
            select relname, n_live_tup from pg_stat_user_tables
             where schemaname='public' and n_live_tup > 0 order by relname" > /tmp/ostre.txt
          spatne=""
          while IFS='|' read -r t n; do
            obnoveno=$(psql -h localhost -p 5432 -U postgres -d obnova -At \
              -c "select count(*) from public.\"$t\"" 2>/dev/null || echo "CHYBI")
            printf "%-32s ostré~%-8s obnovené=%s\n" "$t" "$n" "$obnoveno"
            if [ "$obnoveno" = "CHYBI" ] || [ "$obnoveno" = "0" ]; then spatne="$spatne $t"; fi
          done < /tmp/ostre.txt
          if [ -n "$spatne" ]; then
            echo "::error::V záloze chybí data tabulek:$spatne"
            exit 1
          fi
          echo "Každá neprázdná tabulka ostré databáze je i v obnovené záloze."

      - name: Zašifrování
        env:
          HESLO: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          DATUM=$(date -u +%Y%m%d)
          tar -czf "zaloha-$DATUM.tar.gz" -C zaloha .
          # Bez šifrování by kompletní databáze zákazníků ležela v artefaktu
          # přístupném každému, kdo se dostane do repozitáře.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$HESLO" \
              -o "zaloha-$DATUM.tar.gz.gpg" "zaloha-$DATUM.tar.gz"
          rm -f "zaloha-$DATUM.tar.gz"
          ls -lh "zaloha-$DATUM.tar.gz.gpg"
          echo "DATUM=$DATUM" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: zaloha-db-${{ env.DATUM }}
          path: zaloha-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      # --- Soubory ve Storage ------------------------------------------------
      # Fotky z diagnostiky a podpisy v dumpu databáze nejsou; po havárii by
      # zakázky zůstaly bez příloh. Stahují se jednou týdně (v neděli), aby
      # artefakty nezabraly zbytečně moc místa – denní kopie by byla skoro
      # totožná. Ručně se dá vynutit vstupem „soubory".
      - name: Je čas na soubory?
        id: kdy
        run: |
          if [ "${{ github.event.inputs.soubory }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            echo "ano=1" >> "$GITHUB_OUTPUT"
          else
            echo "ano=0" >> "$GITHUB_OUTPUT"
            echo "Soubory ve Storage se zálohují v neděli, nebo ručním spuštěním se zapnutým vstupem soubory."
          fi

      - name: Soubory ve Storage
        if: steps.kdy.outputs.ano == '1'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HESLO: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Chybí secret VITE_SUPABASE_URL, bez adresy projektu se soubory stáhnout nedají."
            exit 1
          fi
          mkdir -p soubory
          # Neveřejný bucket by přes veřejnou adresu vrátil 400 – radši to
          # řekneme rovnou, ať se nezálohuje polovina souborů potichu.
          neverejne=$(psql "$DB_URL" -At -c "select string_agg(id, ' ') from storage.buckets where not public")
          if [ -n "$neverejne" ]; then
            echo "::error::Bucket(y) $neverejne nejsou veřejné – ke stažení je potřeba service role klíč. Doplň ho do workflow."
            exit 1
          fi
          # Seznam se bere z databáze s oddělovačem tabulátorem: v názvu souboru
          # může být čárka i mezera, z CSV by se pak četla nesmyslná cesta.
          psql "$DB_URL" -At -F "$(printf '\t')" -c \
            "select bucket_id, name from storage.objects order by bucket_id, name" > /tmp/soubory.txt
          chyby=0
          pocet=0
          while IFS="$(printf '\t')" read -r bucket nazev; do
            [ -z "${bucket:-}" ] && continue
            cil="soubory/$bucket/$nazev"
            mkdir -p "$(dirname "$cil")"
            if curl -sfL --retry 3 -o "$cil" \
                 "$SUPABASE_URL/storage/v1/object/public/$bucket/$nazev"; then
              pocet=$((pocet + 1))
            else
              echo "nestaženo: $bucket/$nazev"
              chyby=$((chyby + 1))
            fi
          done < /tmp/soubory.txt
          echo "staženo $pocet souborů, nestaženo $chyby"
          if [ "$chyby" -gt 0 ]; then
            echo "::error::Nepodařilo se stáhnout $chyby souborů ze Storage – záloha příloh je neúplná."
            exit 1
          fi
          tar -czf soubory.tar.gz soubory
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$HESLO" \
              -o "zaloha-storage-$DATUM.tar.gz.gpg" soubory.tar.gz
          rm -rf soubory soubory.tar.gz
          ls -lh "zaloha-storage-$DATUM.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        if: steps.kdy.outputs.ano == '1'
        with:
          name: zaloha-storage-${{ env.DATUM }}
          path: zaloha-storage-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
